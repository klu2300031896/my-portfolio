<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#22252a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgLinear" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#2a2e36" />
      <stop offset="40%" stop-color="#22252a" />
      <stop offset="100%" stop-color="#1b1d22" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="tagShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#5fbe7a" flood-opacity="0.8" />
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e2574c" flood-opacity="0.7" />
    </filter>

    <!-- Pegboard Pattern -->
    <pattern id="pegboardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2b2f36" />
      <circle cx="20" cy="20" r="2.5" fill="#1d2025" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgLinear)" />
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- App Shell Container (width: 1040, center aligned) -->
  <g transform="translate(80, 36)">
    
    <!-- ================= HEADER ================= -->
    <g transform="translate(0, 0)">
      <!-- DJ CARHUB License Plate -->
      <g transform="rotate(-1 110 32)">
        <rect x="0" y="0" width="220" height="58" rx="6" fill="#ece6d8" stroke="#b7af98" stroke-width="3" filter="url(#tagShadow)" />
        <!-- Corner Bolts -->
        <circle cx="14" cy="29" r="3.5" fill="#8a8368" />
        <circle cx="206" cy="29" r="3.5" fill="#8a8368" />
        <!-- Plate Text -->
        <text x="110" y="38" fill="#20222a" font-family="'Space Grotesk', 'Impact', sans-serif" font-weight="900" font-size="28" letter-spacing="3" text-anchor="middle">DJ CARHUB</text>
      </g>
      <text x="2" y="80" fill="#a9aaa4" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">CAR AVAILABILITY — SINGLE OWNER</text>

      <!-- System Online Status (Top Right) -->
      <g transform="translate(900, 18)">
        <circle cx="0" cy="0" r="6.5" fill="#5fbe7a" filter="url(#greenGlow)" />
        <text x="16" y="4" fill="#a9aaa4" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">SYSTEM ONLINE</text>
      </g>
      
      <!-- Dashed Header Divider Line -->
      <line x1="0" y1="98" x2="1040" y2="98" stroke="#3d424c" stroke-width="2" stroke-dasharray="6,6" />
    </g>

    <!-- ================= SECTION 1: CHECK A DATE RANGE ================= -->
    <g transform="translate(0, 120)">
      <!-- Section Label -->
      <text x="0" y="14" fill="#a9aaa4" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" letter-spacing="2">CHECK A DATE RANGE</text>
      <line x1="190" y1="9" x2="1040" y2="9" stroke="#3d424c" stroke-width="1" />

      <!-- Ticket Card Container -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="1040" height="96" rx="6" fill="#ece6d8" filter="url(#cardShadow)" />
        
        <!-- Ticket Side Notches -->
        <circle cx="0" cy="48" r="12" fill="#22252a" />
        <circle cx="1040" cy="48" r="12" fill="#22252a" />

        <!-- Field 1: Start Date -->
        <g transform="translate(36, 18)">
          <text x="0" y="11" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">START DATE</text>
          <rect x="0" y="18" width="280" height="42" rx="4" fill="#fbf9f2" stroke="#b7af98" stroke-width="1.5" />
          <text x="14" y="44" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">02 / 09 / 2026</text>
          <!-- Calendar Icon -->
          <svg x="246" y="30" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8368" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </g>

        <!-- Field 2: End Date -->
        <g transform="translate(340, 18)">
          <text x="0" y="11" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">END DATE</text>
          <rect x="0" y="18" width="280" height="42" rx="4" fill="#fbf9f2" stroke="#b7af98" stroke-width="1.5" />
          <text x="14" y="44" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">05 / 09 / 2026</text>
          <!-- Calendar Icon -->
          <svg x="246" y="30" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8368" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </g>

        <!-- Submit Button -->
        <g transform="translate(644, 36)">
          <rect x="0" y="0" width="230" height="42" rx="4" fill="#20222a" />
          <text x="115" y="26" fill="#f5b942" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">CHECK AVAILABILITY</text>
        </g>

        <!-- Ticket Footer Note -->
        <text x="36" y="84" fill="#8a8368" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">TICKET NO. 0417 — VALID FOR SELECTED RANGE ONLY</text>
      </g>
    </g>

    <!-- ================= SECTION 2: FLEET STATUS ================= -->
    <g transform="translate(0, 275)">
      <!-- Section Label -->
      <text x="0" y="14" fill="#a9aaa4" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" letter-spacing="2">FLEET STATUS</text>
      <line x1="125" y1="9" x2="1040" y2="9" stroke="#3d424c" stroke-width="1" />
      <text x="0" y="36" fill="#a9aaa4" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.5">SELECT A DATE RANGE TO VIEW VEHICLE AVAILABILITY &amp; LIVE STATUS</text>

      <!-- Pegboard Box -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="1040" height="235" rx="8" fill="url(#pegboardPattern)" stroke="#3d424c" stroke-width="1.5" filter="url(#cardShadow)" />

        <!-- 4 Key Tags hanging on Pegs -->

        <!-- TAG 1: Maruti Ertiga (Available) -->
        <g transform="translate(42, 18)">
          <!-- Metal Peg & Hook -->
          <circle cx="100" cy="10" r="7" fill="#2b2f36" stroke="#55595f" stroke-width="3" />
          <line x1="100" y1="16" x2="100" y2="30" stroke="#55595f" stroke-width="2.5" />
          <!-- Paper Key Tag -->
          <g transform="translate(0, 30)">
            <rect x="0" y="0" width="200" height="150" rx="6" fill="#ece6d8" filter="url(#tagShadow)" />
            <text x="18" y="32" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="800">MARUTI ERTIGA</text>
            <text x="18" y="52" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10">7 SEATER MPV</text>
            
            <g transform="translate(18, 76)">
              <circle cx="5" cy="5" r="5" fill="#5fbe7a" filter="url(#greenGlow)" />
              <text x="18" y="9" fill="#1f6b3a" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">AVAILABLE</text>
            </g>

            <rect x="18" y="105" width="164" height="28" rx="4" fill="#20222a" />
            <text x="100" y="123" fill="#f5b942" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BOOK VEHICLE →</text>
          </g>
        </g>

        <!-- TAG 2: Toyota Innova Crysta (Booked) -->
        <g transform="translate(290, 18)">
          <!-- Metal Peg & Hook -->
          <circle cx="100" cy="10" r="7" fill="#2b2f36" stroke="#55595f" stroke-width="3" />
          <line x1="100" y1="16" x2="100" y2="30" stroke="#55595f" stroke-width="2.5" />
          <!-- Paper Key Tag -->
          <g transform="translate(0, 30)">
            <rect x="0" y="0" width="200" height="150" rx="6" fill="#dfd8c6" filter="url(#tagShadow)" />
            <text x="18" y="32" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800">INNOVA CRYSTA</text>
            <text x="18" y="52" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10">PREMIUM 7 STR</text>
            
            <g transform="translate(18, 76)">
              <circle cx="5" cy="5" r="5" fill="#e2574c" filter="url(#redGlow)" />
              <text x="18" y="9" fill="#8a332c" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">BOOKED</text>
            </g>

            <rect x="18" y="105" width="164" height="28" rx="4" fill="#5c2a26" />
            <text x="100" y="123" fill="#ffd9d5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">UNAVAILABLE</text>
          </g>
        </g>

        <!-- TAG 3: Swift Dzire (Available) -->
        <g transform="translate(538, 18)">
          <!-- Metal Peg & Hook -->
          <circle cx="100" cy="10" r="7" fill="#2b2f36" stroke="#55595f" stroke-width="3" />
          <line x1="100" y1="16" x2="100" y2="30" stroke="#55595f" stroke-width="2.5" />
          <!-- Paper Key Tag -->
          <g transform="translate(0, 30)">
            <rect x="0" y="0" width="200" height="150" rx="6" fill="#ece6d8" filter="url(#tagShadow)" />
            <text x="18" y="32" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="800">SWIFT DZIRE</text>
            <text x="18" y="52" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10">COMPACT SEDAN</text>
            
            <g transform="translate(18, 76)">
              <circle cx="5" cy="5" r="5" fill="#5fbe7a" filter="url(#greenGlow)" />
              <text x="18" y="9" fill="#1f6b3a" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">AVAILABLE</text>
            </g>

            <rect x="18" y="105" width="164" height="28" rx="4" fill="#20222a" />
            <text x="100" y="123" fill="#f5b942" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BOOK VEHICLE →</text>
          </g>
        </g>

        <!-- TAG 4: Mahindra Scorpio (Available) -->
        <g transform="translate(786, 18)">
          <!-- Metal Peg & Hook -->
          <circle cx="100" cy="10" r="7" fill="#2b2f36" stroke="#55595f" stroke-width="3" />
          <line x1="100" y1="16" x2="100" y2="30" stroke="#55595f" stroke-width="2.5" />
          <!-- Paper Key Tag -->
          <g transform="translate(0, 30)">
            <rect x="0" y="0" width="200" height="150" rx="6" fill="#ece6d8" filter="url(#tagShadow)" />
            <text x="18" y="32" fill="#20222a" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="800">MAHINDRA SCORPIO</text>
            <text x="18" y="52" fill="#6b6552" font-family="'IBM Plex Mono', monospace" font-size="10">DIESEL 4X4 SUV</text>
            
            <g transform="translate(18, 76)">
              <circle cx="5" cy="5" r="5" fill="#5fbe7a" filter="url(#greenGlow)" />
              <text x="18" y="9" fill="#1f6b3a" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">AVAILABLE</text>
            </g>

            <rect x="18" y="105" width="164" height="28" rx="4" fill="#20222a" />
            <text x="100" y="123" fill="#f5b942" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BOOK VEHICLE →</text>
          </g>
        </g>

      </g>
    </g>

  </g>
</svg>
